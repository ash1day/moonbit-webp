name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        # Pinned so that a new formatter or interface printer does not turn
        # the fmt and mbti checks red on its own
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.15+943464bfa'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn
      - run: moon fmt --check
      - name: Check that the generated interfaces are up to date
        run: moon info && git diff --exit-code
      - run: moon test --target all
